<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMV / ACDV — Révision ferroviaire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-tag">AMV · ACDV — Formation</div>
    <h1>Révision</h1>
    <p>SECUFER · Sécurité ferroviaire</p>
  </div>

  <!-- ACDV — en priorité, bien visible -->
  <div class="nav-section" style="background:rgba(52,211,153,0.07);border-radius:8px;padding:8px 0;margin-bottom:4px">
    <div class="nav-label" style="color:#34d399">ACDV — Double Voie</div>
    <div class="nav-item" id="nav-acdv" onclick="showView('acdv')" style="border-left-color:#34d399;font-weight:600">
      <span class="icon">🆕</span> Accueil ACDV
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">AMV — Navigation</div>
    <div class="nav-item active" id="nav-home" onclick="showView('home')">
      <span class="icon">⌂</span> Accueil AMV
    </div>
    <div class="nav-item" id="nav-fiches" onclick="showView('fiches')">
      <span class="icon">◧</span> Fiches de cours
    </div>
    <div class="nav-item" id="nav-flash" onclick="showView('flash')">
      <span class="icon">⟳</span> Flashcards
    </div>
    <div class="nav-item" id="nav-quiz" onclick="showView('quiz')">
      <span class="icon">✦</span> Quiz
    </div>
    <div class="nav-item" id="nav-dictee" onclick="showView('dictee')">
      <span class="icon">✎</span> Dictée de définitions
    </div>
    <div class="nav-item" id="nav-gares" onclick="showView('gares')" style="border-left-color:var(--accent)">
      <span class="icon">🏘️</span> Gare de Saint-Saturnin
    </div>
  </div>

  <div class="nav-section theme-nav">
    <div class="nav-label">Thèmes</div>
    <div id="theme-nav"></div>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <button class="burger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="topbar-txt">AMV / <span>Accueil</span></div>
    <div id="topbar-right" style="font-family:var(--mono);font-size:11px;color:var(--text3)" title="v8.4 — Gare Saint-Saturnin : try/catch + null checks + fix version">v8.5 — 10 août 2026</div>
  </div>

  <div class="content" id="main-content"></div>
</div>
</div>

<script src="data-fiches.js"></script>
<script src="data-banks.js"></script>
<script src="data-signaux.js"></script>
<script src="app.js"></script>
</body>
</html>
