<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMV — Révision SECUFER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');

:root {
  --bg: #0f0f0f;
  --bg2: #161616;
  --bg3: #1e1e1e;
  --bg4: #252525;
  --border: #2a2a2a;
  --border2: #333;
  --text: #e8e8e8;
  --text2: #a0a0a0;
  --text3: #666;
  --accent: #f0c040;
  --accent2: #d4a800;
  --green: #4caf7d;
  --green-bg: #0d2018;
  --red: #e05555;
  --red-bg: #200d0d;
  --blue: #5b9cf6;
  --blue-bg: #0d1a30;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --radius: 6px;
  --radius2: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo .logo-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.sidebar-logo h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
}
.sidebar-logo p {
  font-size: 12px;
  color: var(--text3);
  margin-top: 2px;
}

.nav-section {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.nav-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text3);
  text-transform: uppercase;
  padding: 0 16px;
  margin-bottom: 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  border-left: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
.nav-item .icon { font-size: 16px; flex-shrink: 0; }

.theme-nav {
  padding: 8px 0;
  flex: 1;
}
.theme-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text3);
  transition: all 0.12s;
  user-select: none;
}
.theme-item:hover { color: var(--text2); background: var(--bg3); }
.theme-item.active { color: var(--accent); background: var(--bg3); }
.theme-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
.theme-item.active .theme-dot { background: var(--accent); }

.main {
  margin-left: 240px;
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-title {
  font-size: 13px;
  font-family: var(--mono);
  color: var(--text2);
}
.topbar-title span { color: var(--accent); }

.content { padding: 32px; flex: 1; max-width: 900px; }

/* ── CARDS ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 20px 24px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 11px;
  font-family: var(--mono);
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
}
.section-heading {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.section-sub {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 24px;
}

/* ── FICHES THÈME ── */
.fiche-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.fiche-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.fiche-card:hover { border-color: var(--border2); background: var(--bg3); }
.fiche-card.active { border-color: var(--accent); }
.fiche-code {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.fiche-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.fiche-sub { font-size: 12px; color: var(--text3); }
.fiche-count {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  margin-top: 10px;
}

/* ── FLASHCARDS ── */
.flashcard-container { perspective: 1200px; margin-bottom: 20px; }
.flashcard-inner {
  position: relative;
  min-height: 220px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.flashcard-inner.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute;
  top: 0; left: 0; right: 0;
  min-height: 220px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 24px 28px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.flashcard-face.back { transform: rotateY(180deg); background: var(--bg3); border-color: var(--accent2); }
.fc-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.fc-label span { color: var(--accent); }
.fc-text { font-size: 16px; line-height: 1.65; font-weight: 400; }
.fc-answer { font-size: 14px; line-height: 1.75; color: var(--text2); white-space: pre-line; }
.fc-hint {
  position: absolute;
  bottom: 14px;
  right: 18px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
}

.fc-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
.btn-accent {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 500;
}
.btn-accent:hover { background: var(--accent2); border-color: var(--accent2); color: #000; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

.fc-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text3);
}
.progress-bar {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── QUIZ ── */
.quiz-q-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.quiz-question {
  font-size: 17px;
  font-weight: 500;
  line-height: 1.55;
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  padding: 12px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  transition: all 0.15s;
  color: var(--text2);
  background: var(--bg3);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 12px;
}
.quiz-opt:hover:not(.disabled) { border-color: var(--border2); color: var(--text); }
.quiz-opt .opt-letter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  width: 20px;
  flex-shrink: 0;
}
.quiz-opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.quiz-opt.correct .opt-letter { color: var(--green); }
.quiz-opt.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.quiz-opt.wrong .opt-letter { color: var(--red); }
.quiz-opt.disabled { cursor: default; pointer-events: none; }

.quiz-expl {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius);
  border-left: 3px solid var(--green);
  background: var(--green-bg);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.65;
  display: none;
}
.quiz-expl.shown { display: block; }

.quiz-score-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg3);
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
}
.score-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.02em;
}
.score-label { color: var(--text3); font-size: 12px; }

.quiz-result {
  text-align: center;
  padding: 40px 20px;
}
.result-big {
  font-size: 64px;
  font-family: var(--mono);
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 8px;
}
.result-sub { font-size: 14px; color: var(--text2); margin-bottom: 24px; }

/* ── FICHE CONTENU ── */
.fiche-content {
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.def-block {
  border-left: 2px solid var(--border2);
  padding: 10px 16px;
  margin-bottom: 12px;
  background: var(--bg3);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.def-term {
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 4px;
}
.def-text {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.65;
  white-space: pre-line;
}
.def-block.important { border-left-color: var(--accent); }
.def-block.important .def-term { color: var(--accent); }

.table-wrap { overflow-x: auto; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  vertical-align: top;
  line-height: 1.55;
}
tr:last-child td { border-bottom: none; }
td:first-child { color: var(--text); font-weight: 500; }

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  background: var(--bg4);
  color: var(--text3);
  border: 1px solid var(--border);
}
.tag.yellow { background: rgba(240,192,64,0.12); color: var(--accent); border-color: rgba(240,192,64,0.2); }
.tag.green { background: var(--green-bg); color: var(--green); border-color: rgba(76,175,125,0.3); }
.tag.red { background: var(--red-bg); color: var(--red); border-color: rgba(224,85,85,0.3); }
.tag.blue { background: var(--blue-bg); color: var(--blue); border-color: rgba(91,156,246,0.3); }

.rule-box {
  background: rgba(240,192,64,0.05);
  border: 1px solid rgba(240,192,64,0.2);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.65;
  color: var(--text2);
}
.rule-box strong { color: var(--accent); font-weight: 500; }

.numbered-list {
  padding-left: 0;
  list-style: none;
}
.numbered-list li {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}
.numbered-list li .num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  min-width: 20px;
  padding-top: 3px;
}

h2.theme-heading {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
  margin-top: 28px;
}
h2.theme-heading:first-child { margin-top: 0; }
.theme-ref {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 16px;
  letter-spacing: 0.06em;
}

/* ── HOME ── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 16px;
}
.stat-num { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: -0.03em; }
.stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; }

.mode-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.mode-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.mode-card:hover { border-color: var(--border2); background: var(--bg3); }
.mode-icon { font-size: 24px; margin-bottom: 12px; }
.mode-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.mode-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }

/* ── DICTÉE ── */
.dictee-textarea {
  width:100%;
  min-height:130px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.7;
  padding:12px 14px;
  resize:vertical;
  outline:none;
  transition:border-color 0.15s;
}
.dictee-textarea:focus { border-color:var(--accent2); }
.diff-ok { color:var(--green); }
.diff-missing { background:rgba(224,85,85,0.18); color:var(--red); border-radius:3px; padding:1px 3px; }
.diff-extra { text-decoration:line-through; color:var(--text3); }
.ref-text { font-size:13px; color:var(--text2); line-height:1.8; white-space:pre-wrap; }
.score-pill {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:20px; font-size:12px; font-weight:500;
  font-family:var(--mono);
}
.score-pill.good { background:var(--green-bg); color:var(--green); border:1px solid rgba(76,175,125,0.3); }
.score-pill.ok { background:rgba(240,192,64,0.1); color:var(--accent); border:1px solid rgba(240,192,64,0.2); }
.score-pill.bad { background:var(--red-bg); color:var(--red); border:1px solid rgba(224,85,85,0.3); }
.kw-tag {
  display:inline-block; padding:2px 8px; margin:2px 3px;
  border-radius:4px; font-size:12px;
  background:rgba(240,192,64,0.1); color:var(--accent);
  border:1px solid rgba(240,192,64,0.15);
}
.kw-tag.found { background:var(--green-bg); color:var(--green); border-color:rgba(76,175,125,0.3); }
.kw-tag.missing { background:var(--red-bg); color:var(--red); border-color:rgba(224,85,85,0.3); } */
.burger {
  display: none;
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 20px;
  padding: 4px;
}
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 90;
}

@media (max-width: 700px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .burger { display: block; }
  .overlay.show { display: block; }
  .mode-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2,1fr); }
  .fiche-grid { grid-template-columns: 1fr; }
  .fc-nav { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-tag">AMV — Formation</div>
    <h1>Révision</h1>
    <p>SECUFER · Sécurité ferroviaire</p>
  </div>

  <div class="nav-section">
    <div class="nav-label">Navigation</div>
    <div class="nav-item active" id="nav-home" onclick="showView('home')">
      <span class="icon">⌂</span> Accueil
    </div>
    <div class="nav-item" id="nav-fiches" onclick="showView('fiches')">
      <span class="icon">◧</span> Fiches de cours
    </div>
    <div class="nav-item" id="nav-flash" onclick="showView('flash')">
      <span class="icon">⟳</span> Flashcards
    </div>
    <div class="nav-item" id="nav-quiz" onclick="showView('quiz')">
      <span class="icon">✦</span> Quiz
    </div>
    <div class="nav-item" id="nav-dictee" onclick="showView('dictee')">
      <span class="icon">✎</span> Dictée de définitions
    </div>
  </div>

  <div class="nav-section theme-nav">
    <div class="nav-label">Thèmes</div>
    <div id="theme-nav"></div>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <button class="burger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="topbar-txt">AMV / <span>Accueil</span></div>
    <div id="topbar-right" style="font-family:var(--mono);font-size:11px;color:var(--text3)">v2.1 — 21 mai 2026</div>
  </div>

  <div class="content" id="main-content"></div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════

const THEMES = [
  { id:'risques',   code:'AMV005/009', title:'Risques ferroviaires & Communication', short:'Risques & Comm.' },
  { id:'formation', code:'AMV901–910', title:'Formation des trains', short:'Formation' },
  { id:'manœuvre',  code:'AMV905',     title:'Manœuvres', short:'Manœuvres' },
  { id:'circulation',code:'AMV101–160',title:'Circulation des trains', short:'Circulation' },
  { id:'incidents', code:'AMV109–113', title:'Incidents de circulation', short:'Incidents' },
  { id:'aiguillage',code:'AMV200–216', title:'Aiguillage & Appareils de voie', short:'Aiguillage' },
  { id:'signaux',   code:'AMV207',     title:'Signaux ferroviaires', short:'Signaux' },
  { id:'encl',      code:'AMV210–211', title:'Enclenchements', short:'Enclenchements' },
  { id:'traction',  code:'AMV600–601', title:'Traction électrique', short:'Traction élec.' },

<div class="rule-box">
  <strong>Code couleur des fiches DC1503 :</strong><br>
  🔵 Bleu : actions à réaliser par AC<br>
  🟡 Jaune : textes de dépêches, formulaires, ordres écrits<br>
  🌸 Rose : Avertissement<br>
  🟢 Vert : Reprise de la circulation normale
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Bestiaux (AMV111)</h3>
<div class="def-block important">
  <div class="def-term">Bestiaux</div>
  <div class="def-text">Tous les animaux d'élevage, seuls ou en troupeau, dont la taille est, au moins, égale à celle d'un mouton. C'est un DANGER et non un obstacle. Zone de protection : 1000 m de part et d'autre du point de signalement, sur toutes les voies de la plateforme.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Passages à niveau (AMV112)</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Type</th><th>Description</th></tr></thead>
  <tbody>
    <tr><td>SAL 0</td><td>Uniquement la signalisation lumineuse automatique</td></tr>
    <tr><td>SAL 2</td><td>2 demi-barrières du côté de l'entrée</td></tr>
    <tr><td>SAL 2B</td><td>2 barrières de la largeur de la chaussée</td></tr>
    <tr><td>SAL 4</td><td>4 demi-barrières</td></tr>
    <tr><td>SAL FC</td><td>À franchissement conditionnel</td></tr>
  </tbody>
</table></div>
<div class="rule-box">
  <strong>Fonctionnement SAL 2 :</strong> Pédale d'annonce franchie → sonnerie → feux rouges clignotent → barrières se baissent → 10 secondes après fermeture → train passe → pédale de reddition → barrières s'ouvrent et feux s'éteignent.<br><br>
  On délivre un <strong>RATO</strong> par circulation jusqu'à rétablissement.
</div>

<div class="def-block important">
  <div class="def-term">Entrave (AMV113)</div>
  <div class="def-text">Action délibérée d'une ou plusieurs personnes revendicatives présentes dans la zone dangereuse, y restant et ayant l'intention d'empêcher la circulation des trains.</div>
</div>
`,

aiguillage: `
<h2 class="theme-heading">Aiguillage & Appareils de voie</h2>
<div class="theme-ref">AMV200 · AMV203 · AMV204 · AMV205 · AMV206 · AMV208 · AMV210 · DC3858</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Définitions de base</h3>
<div class="def-block important">
  <div class="def-term">Aiguille</div>
  <div class="def-text">Sert à diriger et à protéger. Elle peut être empruntée par la pointe ou le talon. On parle à partir de la pointe vers le talon, elle indique la direction droite ou gauche.</div>
</div>
<div class="def-block important">
  <div class="def-term">Aiguilles conjuguées</div>
  <div class="def-text">Lorsqu'un levier contrôle deux aiguilles en même temps, ces aiguilles sont appelées des aiguilles conjuguées.</div>
</div>
<div class="def-block important">
  <div class="def-term">Règle fondamentale de manipulation — "Je manœuvre, je contrôle"</div>
  <div class="def-text">À chaque manipulation d'un levier ou d'une aiguille, l'aiguilleur doit impérativement contrôler l'obéissance de l'installation après la manœuvre. C'est la règle absolue : <strong>JE MANŒUVRE → JE CONTRÔLE.</strong></div>
</div>
<div class="def-block">
  <div class="def-term">Levier immobilisé</div>
  <div class="def-text">Lorsqu'un problème survient sur une installation de sécurité empêchant la manœuvre d'un levier, on dit que le levier est <strong>immobilisé</strong>. Appliquer alors la méthode RITA.</div>
</div>
<div class="def-block">
  <div class="def-term">Levier</div>
  <div class="def-text">Organe de commande mécanique : position + = normale / position − = renversée. Si la position est imposée : on doit la remettre dans cette position imposée.</div>
</div>
<div class="def-block">
  <div class="def-term">Verrou</div>
  <div class="def-text">Dispositif permettant le passage en pointe d'un train sur une aiguille à une vitesse supérieure à 40 km/h. « Lancé » = en action / « Retiré » = pas en action. Peut être indépendant (2 leviers) ou dépendant (lié à l'aiguille).</div>
</div>
<div class="def-block">
  <div class="def-term">Taquet</div>
  <div class="def-text">Dispositif assurant la protection d'une partie de voie contre toute dérive. Position « haute » = en action / « basse » = pas en action. 3 types : Taquet (bloque dérive) · Taquet dérailleur (fait dérailler) · Taquet enrayeur (fait ralentir).</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV204 — Consigne Rose (DC3858)</h3>
<div class="rule-box">
  La consigne rose a pour but de décrire les installations de sécurité, d'indiquer les règles d'utilisation et les particularités de fonctionnement des installations de sécurité et de préciser les vérifications à effectuer en cas de dérangement.
</div>
<div class="def-block">
  <div class="def-term">Chapitres</div>
  <div class="def-text">Chap. 1 : Généralités - Contrôles | Chap. 2 : Signaux | Chap. 3 : Appareils de voie | Chap. 4 : Enclenchements électriques | Chap. 5 : Relations avec les PN voisins
Annexes : 1 Schéma signalisation · <strong>2 Tableau des mouvements</strong> · 3 Enclenchements poste à poste · 4 Encl. aiguilles · 5 Encl. d'approche · 6 Annulation des transits · 7 Points de manœuvre · 8 Petit matériel</div>
</div>

<div class="def-block important">
  <div class="def-term">Tableau des mouvements — Annexe 2 de la Consigne Rose</div>
  <div class="def-text">Le tableau des mouvements recense l'ensemble des itinéraires possibles dans la zone d'action d'un poste : pour chaque mouvement, il indique quels leviers manœuvrer, dans quel ordre, et les conditions à réunir (aiguilles à positionner, signaux à ouvrir).
Il est utilisé par l'aiguilleur pour <strong>préparer ses manœuvres de leviers et d'aiguilles</strong> avant d'exécuter un itinéraire. C'est le document de référence pratique de l'aiguilleur au quotidien.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Dispositifs d'Attention</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Sigle</th><th>Couleur</th><th>Signification</th></tr></thead>
  <tbody>
    <tr><td>DA</td><td>🔴 Rouge</td><td>Dispositif d'Attention — interdit de manœuvrer ABSOLUMENT. Interdit de retirer le DA</td></tr>
    <tr><td>DR</td><td>🟡 Jaune</td><td>Dispositif de Réflexion</td></tr>
    <tr><td>DSA</td><td>🔵 Bleu</td><td>Dispositif Spécial d'Attention</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV205 — Ouverture des signaux (Art. 203.2)</h3>
<div class="rule-box">
  Un signal ne doit être ouvert que si :<br>
  1. Les appareils de voie sont convenablement disposés et les aiguilles collent<br>
  2. Les croisements des appareils de voie sont dégagés<br>
  3. La protection du parcours est assurée<br>
  4. La partie de voie intéressée est libre
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Temps moral</h3>
<div class="def-block important">
  <div class="def-term">Temps moral</div>
  <div class="def-text">Délai que doit respecter l'aiguilleur après la fermeture d'un signal de protection (carré, guidon, sémaphore) pour s'assurer qu'aucune circulation, même ayant franchi fermé le signal d'avertissement correspondant, ne se trouve engagée entre ce signal d'avertissement et le signal d'arrêt. Il dépend des circonstances locales.</div>
</div>
`,

signaux: `
<h2 class="theme-heading">Signaux ferroviaires</h2>
<div class="theme-ref">AMV207 · DC11482 · OP0839 · OP0580</div>

<div class="rule-box">
  <strong>Fermé = présenté = affiché</strong><br>
  <strong>Ouverture = effacé</strong><br>
  Implantés à demeure généralement à gauche (sauf Alsace à droite).
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">À quoi servent les signaux ?</h3>
<ul class="numbered-list">
  <li><span class="num">1.</span>Arrêter et retenir les trains</li>
  <li><span class="num">2.</span>Limiter la vitesse des trains</li>
  <li><span class="num">3.</span>Transmettre des indications ou des ordres divers</li>
  <li><span class="num">4.</span>Transmettre des ordres propres à la traction électrique</li>
</ul>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Types de signaux</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Critère</th><th>Types</th></tr></thead>
  <tbody>
    <tr><td>Durée</td><td>Permanents / Temporaires</td></tr>
    <tr><td>Mobilité</td><td>Mobiles / Fixes</td></tr>
    <tr><td>Technologie</td><td>Lumineux / Mécaniques</td></tr>
    <tr><td>Visibilité</td><td>À visibilité normale / Réduite / Annulés</td></tr>
    <tr><td>Implantation</td><td>À gauche (sauf Alsace : droite)</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Signaux permanents lumineux</h3>
<div class="def-block">
  <div class="def-term">Panneaux</div>
  <div class="def-text">Circulaires ou oblongs · Un ou plusieurs feux de couleur · Fixes ou clignotants</div>
</div>
<div class="def-block">
  <div class="def-term">Tableaux</div>
  <div class="def-text">Lumineux ou réflétorisés (ex : TIV, tableaux de vitesse)</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Signaux permanents mécaniques</h3>
<div class="rule-box">
  <strong>Position de fermeture :</strong> perpendiculaires aux voies<br>
  <strong>Position d'ouverture :</strong> parallèlement aux voies
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Distances minimales de visibilité</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Vitesse</th><th>Distance</th></tr></thead>
  <tbody>
    <tr><td>V ≤ 60 km/h</td><td>100 m</td></tr>
    <tr><td>60 < V ≤ 120 km/h</td><td>200 m</td></tr>
    <tr><td>V > 120 km/h</td><td>300 m</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">5 Familles de signaux</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Famille</th><th>Nom</th><th>Contenu</th></tr></thead>
  <tbody>
    <tr><td>A</td><td>Signaux d'arrêt</td><td>Carré · Carré violet · Sémaphore · SAM · Disque · Guidon d'arrêt <span class="tag yellow">2C2SDG</span></td></tr>
    <tr><td>B</td><td>Annonce d'arrêt</td><td>Avertissement · Feu rouge clignotant · Feu jaune clignotant · Feu vert clignotant · Bande jaune horizontale</td></tr>
    <tr><td>C</td><td>Limitation de vitesse</td><td>TIV fixe · TIV mobile (>60 km/h)</td></tr>
    <tr><td>D</td><td>Signaux d'ouverture</td><td>Feu vert · Feu blanc · Feu blanc clignotant</td></tr>
    <tr><td>E</td><td>Signaux divers</td><td>Chevron · Indicateurs de direction · Tableau Garage · Baisser/Remonter panto · Couper/Remettre courant</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Famille A — Signaux d'arrêt (mémo : 2C2SDG)</h3>
<div class="rule-box">
  Les signaux d'arrêt commandent l'arrêt du train <strong>avant</strong> le signal pour :<br>
  • Protéger un itinéraire, une aiguille, un passage à niveau<br>
  • Assurer l'espacement des trains
</div>
<div class="def-block important">
  <div class="def-term">Carré</div>
  <div class="def-text">Rôle principal : protéger les aiguilles. Aussi : protéger le stationnement · assurer le cantonnement · protéger les obstacles · arrêter les trains. <strong>Arrête ET retient.</strong></div>
</div>
<div class="def-block">
  <div class="def-term">Carré Violet</div>
  <div class="def-text">Utilisé sur les voies principales pour les manœuvres.</div>
</div>
<div class="def-block important">
  <div class="def-term">Sémaphore</div>
  <div class="def-text">Sert à l'espacement des trains. Implanté à l'origine du canton qu'il protège. Œilleton allumé = sémaphore / Œilleton fermé = carré. Sans œilleton avec F = sémaphore.</div>
</div>
<div class="def-block">
  <div class="def-term">SAM — Signal d'Arrêt à Main</div>
  <div class="def-text">Commande l'arrêt immédiat. De jour : drapeau rouge déployé ou jalon d'arrêt à damier. De nuit : feu rouge d'une lanterne ou jalon d'arrêt. Protège un chantier ou obstacle inopiné.</div>
</div>
<div class="def-block">
  <div class="def-term">Disque</div>
  <div class="def-text">Sur lignes équipées de Block manuel pour la protection des petites gares ou établissements de pleine ligne.</div>
</div>
<div class="def-block">
  <div class="def-term">Guidon d'arrêt</div>
  <div class="def-text">Protection d'un point particulier (ex : PN).</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Famille B — Signaux d'annonce d'arrêt</h3>
<div class="rule-box">
  Ils indiquent que le <strong>signal d'arrêt suivant est fermé</strong> et commandent au conducteur d'être en mesure de s'arrêter avant.
</div>
<div class="table-wrap"><table>
  <thead><tr><th>Signal</th><th>Rôle / Particularité</th></tr></thead>
  <tbody>
    <tr><td>Avertissement (feu jaune fixe)</td><td>Annonce principal d'un signal d'arrêt</td></tr>
    <tr><td>Feu rouge clignotant</td><td>Annonce courte distance — franchissable SANS arrêt</td></tr>
    <tr><td>Feu jaune clignotant</td><td>Annonce signal d'arrêt — marche à vue</td></tr>
    <tr><td>Feu vert clignotant</td><td>Annonce ralentissement</td></tr>
    <tr><td>Bande lumineuse jaune horizontale</td><td>Informe le conducteur qu'il va entrer sur une voie à quai courte ou raccourcie</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Famille D — Signaux présentés à l'ouverture</h3>
<div class="rule-box">
  Ils donnent l'autorisation au conducteur de franchir le signal :<br>
  • <strong>Feu vert</strong> → franchissement sans restriction (voie principale)<br>
  • <strong>Feu blanc</strong> et <strong>feu blanc clignotant</strong> → franchissement avec restrictions (voie de service)
</div>
`,

encl: `
<h2 class="theme-heading">Enclenchements</h2>
<div class="theme-ref">AMV210 · AMV211 · DC3858 · Consigne Rose Chap.4 · Annexes 3-4-5</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV210 — Enclenchements mécaniques</h3>
<div class="def-block important">
  <div class="def-term">Rôle (Art. 201.1)</div>
  <div class="def-text">Les enclenchements mécaniques ont pour but de matérialiser les conditions de manœuvre des organes de commande des signaux et des appareils de voie, notamment l'ordre dans lequel ils doivent être manœuvrés.</div>
</div>
<div class="def-block">
  <div class="def-term">3 types d'enclenchements mécaniques</div>
  <div class="def-text">1. Les TOCS (directement entre les leviers)
2. La TABLE D'ENCLENCHEMENT (horizontale ou verticale, derrière les leviers)
3. Les SERRURES (dont serrures à transmetteur électrique)</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV211 — Enclenchements électriques (4 types)</h3>
<div class="def-block important">
  <div class="def-term">Zone Isolée (ZI) — Art. 214 — Annexe 4A</div>
  <div class="def-text">Rôle : Interdire la manœuvre d'une aiguille pendant son franchissement par une circulation
Agit sur : Levier de l'aiguille (position + ou −)
Mise en action : dès que la zone propre est présumée occupée (rouge)
Libération : libération de la zone propre (blanc)</div>
</div>
<div class="def-block important">
  <div class="def-term">CIP — Contrôle Impératif Permanent — Art. 212 — Annexe 2 partie 3</div>
  <div class="def-text">Rôle : Maintenir fermé le signal de protection ou provoquer sa fermeture si l'aiguille ne réunit pas ses 4 conditions :
1. Concordance de la position terrain / poste
2. Collage de la lame appliquée donnant la direction
3. Décollage de la lame opposée (aiguille intègre)
4. Verrouillage lancé le cas échéant
Libération : quand les 4 conditions sont réunies (voyant allumé)</div>
</div>
<div class="def-block important">
  <div class="def-term">Zone de Protection (ZP) — Art. 218 — Annexe 2 P2 ou P3</div>
  <div class="def-text">Rôle : Protéger des mouvements ou des véhicules en stationnement
Agit sur : Levier de signal origine OU circuit de commande du signal
Mise en action : dès qu'une Zone de Protection est présumée occupée (rouge)
Libération : libération de la zone (blanc)</div>
</div>
<div class="def-block important">
  <div class="def-term">EAP — Enclenchement d'Approche — Art. 216 — Annexe 5</div>
  <div class="def-text">Rôle : Interdire toute opération permettant une destruction prématurée d'itinéraire (manœuvre d'une aiguille devant une circulation)
Agit sur : Levier du signal de protection (position −)
Mise en action : ZAP présumée occupée (rouge) ET signal commandé à l'ouverture (levier en −)
Libération : ZAP libre (blanc) OU fermeture automatique du signal après passage d'une circulation</div>
</div>
`,

traction: `
<h2 class="theme-heading">Traction électrique</h2>
<div class="theme-ref">AMV600 · AMV601 · DC8043 · Consigne Bleue · RRG0474 · OP847</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV600 — Présentation</h3>
<div class="def-block">
  <div class="def-term">Organisation de la caténaire</div>
  <div class="def-text">La caténaire est découpée en : Secteur → Sous-Secteur → Sections élémentaires (S.él)</div>
</div>
<div class="def-block important">
  <div class="def-term">Section élémentaire (S.él)</div>
  <div class="def-text">Plus petit élément de caténaire pouvant être isolé des éléments encadrants par un ou plusieurs appareils d'interruption.</div>
</div>
<div class="def-block">
  <div class="def-term">Consigne Bleue — Rôle</div>
  <div class="def-text">Décrit les installations de traction électrique de la gare et précise les modalités d'application de la DC8043. Chapitres : 1 Description · 2 Application des procédures · 3 Tableaux consignation C. Annexes : 1 Schéma synoptique · 2 Coffret IA2</div>
</div>
<div class="def-block important">
  <div class="def-term">Protection C</div>
  <div class="def-text">Ensemble des mesures interdisant aux circulations électriques l'accès aux voies situées sous l'élément de caténaire à consigner, de façon à empêcher que les pantographes ne réalimentent cet élément par pontage d'un sectionnement.</div>
</div>
<div class="def-block">
  <div class="def-term">Circulation électrique</div>
  <div class="def-text">Toute circulation comportant au moins un pantographe (sauf assurance qu'il est et restera baissé) ou bi-mode.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV601 — Protection C (DC8043 Fiche 30)</h3>
<ul class="numbered-list">
  <li><span class="num">1</span>Noter ordre Agent E → RDTE (colonnes 1 à 4)</li>
  <li><span class="num">2</span>Vérifier si concerné ? Consulter Art. 2 Consigne Bleue</li>
  <li><span class="num">3</span>Consigne Bleue Art. 3 → identifier la page correspondant à la S.él</li>
  <li><span class="num">4</span>Identifier la S.él + mesures de Protection C page de droite</li>
  <li><span class="num">5</span>Apposer DSA sur levier (munit le levier de l'aiguille d'un DSA)</li>
  <li><span class="num">6</span>Vérifier absence de circulation électrique entre aiguille et 1er isolateur</li>
  <li><span class="num">7</span>AUTOCONTRÔLE : ferme et rouvre</li>
  <li><span class="num">8</span>Aviser Agent E "Protection C assurée dans la S.él XXX" → RDTE col. 7&8</li>
</ul>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Manœuvre d'un sectionneur (Fiche 32)</h3>
<ul class="numbered-list">
  <li><span class="num">1</span>Noter ordre Agent E → RDTE col. 1 à 4</li>
  <li><span class="num">2</span>Localiser le sectionneur → Consigne Bleue Art. 5</li>
  <li><span class="num">3</span>Noter le N° sectionneur (post-it), prévenir régulateur et AC, fermer le poste</li>
  <li><span class="num">4</span>Prendre EPI (gants, casque, gilet orange, chaussures de sécurité) + clé N°X + écriteau</li>
  <li><span class="num">5</span>Identifier sectionneur sur schéma ITE & schéma des pistes et itinéraires</li>
  <li><span class="num">6</span>Sur place : vérifier position actuelle du couteau (doit être fermé). L'ordre est-il réalisable ?</li>
  <li><span class="num">7</span>Équiper EPI (dont gants) + monter sur caillebotis</li>
  <li><span class="num">8</span>Retirer cadenas + goupille</li>
  <li><span class="num">9</span>Manœuvrer le levier d'un geste franc et rapide + remettre goupille</li>
  <li><span class="num">10</span>Vérifier nouvelle position : obéissance = ouverture du couteau</li>
  <li><span class="num">11</span>Insérer écriteau « Condamné, défense de manœuvrer » + cadenas</li>
  <li><span class="num">12</span>AUTOCONTRÔLE</li>
  <li><span class="num">13</span>Retourner au poste + Aviser Agent E → RDTE "sectionneur XXX ouvert et condamné"</li>
</ul>
`,

travaux: `
<h2 class="theme-heading">Travaux sur les voies & IS</h2>
<div class="theme-ref">AMV300 · AMV310 · AMV216 · AMV250 · DC3978 · IN1582 · OP565</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV300 — Travaux sur les voies (DC3978)</h3>
<div class="def-block important">
  <div class="def-term">Planche-travaux (PTx)</div>
  <div class="def-text">ZEP ou groupement de ZEP dédié aux travaux pendant une période déterminée.</div>
</div>
<div class="def-block important">
  <div class="def-term">ZEP — Zone Élémentaire de Protection</div>
  <div class="def-text">Partie de voie résultant du découpage du RFN pour les besoins de la maintenance. Peut être de type « G » en gare ou de type « L » en ligne. Chaque ZEP est consignée dans la consigne de protection du poste.</div>
</div>
<div class="def-block important">
  <div class="def-term">DFV — Demande de Fermeture de Voie</div>
  <div class="def-text">Procédé d'assurance-chantier reposant sur une fermeture de voie effectuée par l'exploitation et accompagnée de la mise en œuvre d'un bouclage par l'équipement.</div>
</div>
<div class="def-block">
  <div class="def-term">Assurance-chantier</div>
  <div class="def-text">Assurance que la zone de chantier est à la fois protégée et libre de toute circulation ne pouvant s'arrêter avant une activité. 2 procédés : DFV (fermeture par exploitation + bouclage) ou GEq (protection par maintenance seule).</div>
</div>
<div class="rule-box">
  <strong>Entente préalable :</strong> Concertation entre RPTx et AC, au minimum 30 minutes avant le début de la planche-travaux.
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV250 — Dérangements IS (DC3858 + Consigne Rose + CDIS)</h3>
<div class="def-block important">
  <div class="def-term">Méthode globale RITA</div>
  <div class="def-text">Risque immédiat ? → Prendre mesures de sécurité (arrêter et retenir)
Identifier la nature du dérangement et ses conséquences
Traiter le dérangement (DC3858 Chap. 4)
Aviser AC, COGC et annoter le CDIS pour l'AMI</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">AMV216 — Catégories A/B/C (OP565)</h3>
<div class="def-block important">
  <div class="def-term">Catégorie A</div>
  <div class="def-text">Circulations « légères » pouvant provoquer des déshuntages brefs et intermittents (ex : autorail, thermique, bi-mode, locotracteurs).</div>
</div>
<div class="def-block important">
  <div class="def-term">Catégorie B</div>
  <div class="def-text">Circulation comportant au moins un véhicule à empattement long et pouvant provoquer un déshuntage temporaire au passage de ce véhicule sur un circuit de voie court (ex : porte-char).</div>
</div>
<div class="def-block important">
  <div class="def-term">Catégorie C</div>
  <div class="def-text">Circulation considérée « non shunteuse » et provoquant des déshuntages prolongés. Ne peut pas être expédiée de façon autonome sur une ligne équipée de circuit de voie. Doit être incorporée dans un train encadré par des véhicules assurant le bon fonctionnement des circuits de voie.</div>
</div>
`,

epi: `
<h2 class="theme-heading">EPI & Déplacements</h2>
<div class="theme-ref">AMV801 · RRA0068 · OP485</div>

<div class="def-block important">
  <div class="def-term">EPI — Équipements de Protection Individuels</div>
  <div class="def-text">Dispositifs ou moyens visés à l'article R4311-8 du code du travail visant à protéger un travailleur contre un ou plusieurs risques susceptibles de menacer sa sécurité ou sa santé.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Les 9 familles d'EPI</h3>
<ul class="numbered-list">
  <li><span class="num">1</span>Signalisation visuelle de l'utilisateur <strong>(THV : Tenue Haute Visibilité)</strong></li>
  <li><span class="num">2</span>Tête et visage</li>
  <li><span class="num">3</span>Ouïe <strong>(PICB : Protecteurs Individuels Contre le Bruit)</strong></li>
  <li><span class="num">4</span>Yeux</li>
  <li><span class="num">5</span>Respiratoire</li>
  <li><span class="num">6</span>Mains</li>
  <li><span class="num">7</span>Corps</li>
  <li><span class="num">8</span>Pieds</li>
  <li><span class="num">9</span>Chutes de hauteur</li>
</ul>

<div class="def-block important">
  <div class="def-term">Emprises ferroviaires (RRA20000 Art. 6.2)</div>
  <div class="def-text">L'accès aux emprises ferroviaires n'est autorisé qu'en cas de nécessité de service. Un agent ne peut se déplacer dans une emprise ferroviaire que s'il est :
• Habilité à une TES (tâche essentielle de sécurité)
• Autorisé selon les dispositions du document d'application
• Accompagné par un agent habilité TES ou autorisé</div>
</div>
<div class="def-block important">
  <div class="def-term">Emplacement de garage (EG) — Art. 6.2</div>
  <div class="def-text">Lieu où les agents avec matériel ou outillage peuvent se garer en dehors de toute zone dangereuse lors du passage d'une circulation. Largeur minimale : 0,70 m.</div>
</div>
<div class="def-block important">
  <div class="def-term">Pistes et itinéraires (Art. 6.4.2)</div>
  <div class="def-text">Aménagements créés pour longer ou traverser les voies. Destinés au déplacement du personnel et de son outillage. Les pistes longent les voies principales en pleine voie ou dans les gares. Les itinéraires existent en dehors des voies principales dans les gares, triages, dépôts ou les ateliers. Obstacles fixes peints en blanc.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">OP485 Art.111 — Véhicules automoteurs</h3>
<div class="def-block important">
  <div class="def-term">Règles d'utilisation des véhicules automoteurs sur pistes carrossables</div>
  <div class="def-text">Le conducteur doit :
• Rester en dehors des voies, à une distance d'au moins <strong>1,50 m du rail</strong>
• Respecter la signalisation routière
• Ne pas dépasser la vitesse de <strong>40 km/h</strong>
• Céder la priorité à tout véhicule plus lourd ou plus encombrant
• Immobiliser le véhicule à l'approche d'une circulation sur la voie contiguë (sauf si bord de piste > 2,00 m du rail)
• <strong>De nuit : l'utilisation des FEUX DE ROUTE (plein phares) est INTERDITE</strong></div>
</div>
<div class="rule-box">
  Autorisation spéciale du chef d'établissement si : largeur > 2,50 m · hauteur > 4,00 m · poids > 12 tonnes.
</div>
<div class="rule-box">
  <strong>Vitesse max :</strong> 20 km/h<br>
  <strong>Mettre pied à terre</strong> si circulation sur voie contiguë<br>
  <strong>Interdit :</strong> traverser les voies (sauf itinéraire carrossable) · dans les tunnels/ponts (sauf piste aménagée) · par temps de visibilité réduite · à 2 personnes · atteler une remorque (sauf ≥ 2 m du rail) · de nuit (éviter, éclairage obligatoire si nécessaire)
</div>
`,

zd: `
<h2 class="theme-heading">Zone dangereuse (ZD)</h2>
<div class="theme-ref">RRA20068 · AMV801</div>

<div class="def-block important">
  <div class="def-term">Zone dangereuse (ZD)</div>
  <div class="def-text">Zone de danger, définie voie par voie, dans laquelle un agent ou l'outillage ou le matériel qu'il manipule peut être heurté ou accroché par une circulation de véhicule de transport ferroviaire ou guidé ou subir son effet de souffle de manière dangereuse. Les distances sont mesurées par rapport au bord extérieur du rail.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Distances de la zone dangereuse</h3>
<div class="table-wrap"><table>
  <thead><tr><th>Ligne</th><th>Vitesse</th><th>Distance ZD</th></tr></thead>
  <tbody>
    <tr><td>Hors LGV</td><td>V ≤ 40 km/h</td><td>1,25 m (1,50 m en courbe)</td></tr>
    <tr><td>Hors LGV</td><td>40 < V ≤ 160 km/h</td><td>1,50 m</td></tr>
    <tr><td>Hors LGV</td><td>V > 160 km/h</td><td>2,00 m</td></tr>
    <tr><td>LGV</td><td>V ≤ 300 km/h</td><td>2,00 m</td></tr>
    <tr><td>LGV</td><td>V > 300 km/h</td><td>2,30 m</td></tr>
  </tbody>
</table></div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Avant d'engager la ZD</h3>
<div class="rule-box">
  1. Marquer l'arrêt<br>
  2. Regarder attentivement dans la ou les directions d'où peut survenir une circulation<br>
  3. S'assurer de disposer de la <strong>DMVC</strong><br>
  4. Redoubler de prudence en cas d'intempéries ou zone bruyante<br>
  5. Se déplacer dans le sens opposé au sens normal des circulations (double voie)
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Traversée des voies</h3>
<div class="rule-box">
  <strong>Avant :</strong> MARQUER L'ARRÊT · REGARDER · ÉCOUTER · S'ASSURER DE LA DMVC (hors chemins publics)<br>
  <strong>Pendant :</strong> TRAVERSER FRANCHEMENT sans s'attarder · Éviter de poser le pied sur le rail ou aiguillage · Usage de distracteurs d'attention INTERDIT<br>
  <strong>Après :</strong> Dégager la ZD — la traversée n'est achevée qu'une fois la ZD dégagée
</div>

<div class="def-block important">
  <div class="def-term">Arrivée surprise d'une circulation dans la ZD</div>
  <div class="def-text">• Dégager immédiatement la ZD
• Si impossible : se coucher sur le sol, en dehors de la voie
• Tête dirigée du côté d'où vient la circulation
• Vêtements ramenés près du corps
• Si circulation sur voie contiguë : la regarder venir</div>
</div>

<div class="def-block important">
  <div class="def-term">DMVC — Distance Minimale de Visibilité Compatible</div>
  <div class="def-text">Distance minimale de visibilité dont doit disposer un agent avant d'engager la ZD en dehors des chemins publics et des itinéraires. Sans cette distance : choisir un autre endroit ou demander l'interdiction de circulation ou la mise en place d'un dispositif d'annonce.</div>
</div>
<div class="def-block important">
  <div class="def-term">DATZD — Dispositif d'Autorisation de Traverser la Zone Dangereuse</div>
  <div class="def-text">Dispositif permettant la traversée d'une ou de deux voies lorsque la visibilité ou la réglementation ne le permet pas. 1 demande par personne : 1 voie = 10 secondes, 2 voies = 15 secondes.</div>
</div>
<div class="def-block important">
  <div class="def-term">DAELZD — Dispositif d'Autorisation d'Engagement Longitudinal de la Zone Dangereuse</div>
  <div class="def-text">Dispositif permettant l'engagement de la ZD de la voie longeant un obstacle dont le franchissement est impossible du fait d'une visibilité insuffisante. Il fait l'objet d'une consigne d'utilisation reprise dans la consigne des particularités locales.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Engagement de la ZD — Art. 6.2.1 — Délais de visibilité requis</h3>
<div class="def-block important">
  <div class="def-term">6.2.1.1 — Engagement transversal sur voie(s) principale(s)</div>
  <div class="def-text">L'engagement transversal n'est autorisé que lorsque le délai de visibilité, pour chaque sens de circulation, est au moins égal à :
• <strong>10 secondes</strong> — plateformes à 1 ou 2 voies
• <strong>15 secondes</strong> — plateformes à 3 ou 4 voies
• <strong>20 secondes</strong> — plateformes à 5 ou 6 voies
➤ Plus de 6 voies : disposer d'un EG intermédiaire après avoir traversé au plus 6 voies.</div>
</div>
<div class="def-block important">
  <div class="def-term">6.2.1.2 — Engagement transversal sur voie(s) de service</div>
  <div class="def-text">Sur une voie de service libre de circulation, l'engagement transversal n'est autorisé que lorsque le délai de visibilité est au moins égal à <strong>10 secondes</strong> soit au moins <strong>90 mètres</strong>.</div>
</div>
<div class="def-block important">
  <div class="def-term">6.2.1.3 — Engagement longitudinal (contourner un obstacle)</div>
  <div class="def-text">L'engagement longitudinal n'est autorisé que lorsque le délai de visibilité, pour chaque sens de circulation concerné, est au moins égal à :
• <strong>10 secondes</strong> — obstacle continu jusqu'à 5 m
• <strong>15 secondes</strong> — obstacle supérieur à 5 m jusqu'à 10 m
• <strong>20 secondes</strong> — obstacle supérieur à 10 m jusqu'à 15 m
➤ Obstacle supérieur à 15 m : mesures reprises à la consigne des particularités locales.
➤ Ouvrages d'art (tunnel, viaduc...) : mesures spéciales si délai insuffisant entre 2 refuges ou 2 niches.</div>
</div>
`,

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Installations concernées (Art. 2)</h3>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">3 familles d'interdictions (Art. 4.6)</h3>

Eau : Interdit de diriger des lances à jet sur les installations électriques · de jeter de l'eau pour lutter contre un incendie · d'uriner sur les installations ou leurs supports</div>

  <div class="def-term">OBJETS MANIPULÉS</div>
  <div class="def-text">Interdit de projeter des objets métalliques sur des installations électriques · d'utiliser des objets métalliques au voisinage d'installations comportant des conducteurs nus ou des pièces nues sous tension</div>

graissage: `
<h2 class="theme-heading">Graissage des aiguilles</h2>
<div class="theme-ref">AMV804 · OP487</div>

<div class="def-block important">
  <div class="def-term">Graissage</div>
  <div class="def-text">Travail de maintenance légère d'une aiguille qui consiste à nettoyer et graisser les parties mobiles de l'appareil de voie.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Art. 201 — Principes fondamentaux</h3>
<div class="def-block important">
  <div class="def-term">Règle absolue dès audition du signal ou vision d'une circulation</div>
  <div class="def-text">• Quitter la zone dangereuse immédiatement
• Se garer au plus près et sans délai hors de toute zone dangereuse
• Demeurer sur place jusqu'à ce que la circulation soit passée COMPLÈTEMENT
• Si circulation sur voie contiguë : la regarder venir pour détecter tout obstacle engageant le gabarit</div>
</div>
<div class="rule-box">
  <strong>Cas exceptionnel — arrivée surprise :</strong> Se coucher sur le sol, en dehors de la voie, tête dirigée du côté d'où vient la circulation, vêtements ramenés près du corps.
</div>
<div class="rule-box">
  <strong>Interdit</strong> de laisser des outils ou matériaux à l'intérieur de la ZD (risque de projection par effet de souffle).
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Art. 204 — Périodes de graissage</h3>
<div class="rule-box">
  • Déterminées à chaque nouveau service ou modification importante<br>
  • Situées aux moments de plus faible densité de circulation<br>
  • Périodes de nuit : <strong>exceptionnelles et justifiées</strong> par l'importance de la circulation diurne<br>
  • <strong>INTERDIT par temps de brouillard</strong>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Art. 205 — 3 modes de protection</h3>
<div class="def-block important">
  <div class="def-term">A — Interdiction de circulation possible</div>
  <div class="def-text">A1 — Toute la zone d'un poste : l'aiguilleur ferme les signaux et graisse lui-même.
A2 — Partie de la zone : protection via installations du poste + DPGR (Demande de Protection Graissage).</div>
</div>
<div class="def-block important">
  <div class="def-term">B — Interdiction impossible</div>
  <div class="def-text">L'équipe est sous surveillance d'un agent sécurité qui annonce l'approche des circulations par un son allongé émis à l'aide de la trompe réglementaire. L'agent sécurité indique les mesures particulières, les limites de zone et les emplacements de garage.</div>
</div>
<div class="def-block important">
  <div class="def-term">C — Graissage de nuit / Appareils télécommandés</div>
  <div class="def-text">Les mesures de protection A2 (DPGR) doivent obligatoirement être appliquées.</div>
</div>

<h3 style="font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text2)">Matériel de protection du graisseur</h3>
<div class="def-block">
  <div class="def-term">Aiguille classique</div>
  <div class="def-text">Appareil protecteur pour graisseur d'aiguilles : immobilise l'aiguille + présente un jalon à damier attirant l'attention des mécaniciens.</div>
</div>
<div class="def-block important">
  <div class="def-term">Aiguille à moteur (télécommandée)</div>
  <div class="def-text">L'appareil protecteur NE DOIT PAS être utilisé. Le graisseur se munit d'un DRAPEAU ROUGE À HAMPE qu'il fixe dans la voie, à proximité de l'appareil, pendant toute la durée du travail.</div>
</div>

{theme:'formation', tag:'AMV904', q:'Décrire la signalisation d\'avant et d\'arrière d\'un train.',

{theme:'manœuvre', tag:'AMV905', q:'Définir "manœuvre" et le rôle du CdM.',

{theme:'manœuvre', tag:'AMV905', q:'Que signifient les ordres TIREZ et REFOULEZ ?',

{theme:'manœuvre', tag:'Art.6', q:'Quelle distance minimale pour passer devant un véhicule arrêté ?',

{theme:'circulation', tag:'AMV160', q:'Définir la marche à vue (VM).',

{theme:'circulation', tag:'AMV160', q:'Quelle est la différence entre BAL et BAPR concernant le franchissement d\'un sémaphore fermé ?',
 a:'BAL : sémaphore permissif. Après arrêt, le conducteur peut le franchir DE LUI-MÊME en marche à vue.\nBAPR : doit se faire reconnaître + accord verbal de l\'aiguilleur. Si impossible : attendre 15 min, puis marche à vue sur tout le canton.'},
{theme:'circulation', tag:'AMV101', q:'Qu\'est-ce que l\'ONJ ?',

{theme:'circulation', tag:'AMV101', q:'Définir un train à marche indéterminée (MI).',

// INCIDENTS
{theme:'incidents', tag:'AMV109', q:'Définir obstacle, danger et présomption de danger.',

{theme:'incidents', tag:'AMV111', q:'Qu\'est-ce qu\'un "bestiaux" dans le contexte ferroviaire et quelle zone de protection ?',
 a:'Tous les animaux d\'élevage, seuls ou en troupeau, dont la taille est, au moins, égale à celle d\'un mouton. C\'est un DANGER (pas un obstacle). Zone de protection : 1000 m de part et d\'autre du point de signalement, sur toutes les voies.'},
{theme:'incidents', tag:'AMV113', q:'Définir une entrave.',

// AIGUILLAGE
{theme:'aiguillage', tag:'AMV203', q:'Qu\'est-ce que talonner une aiguille ?',

{theme:'aiguillage', tag:'AMV207', q:'Quels sont les 3 DA/DR/DSA et leurs couleurs ?',

{theme:'aiguillage', tag:'Art.203.2', q:'Quelles sont les 4 conditions pour ouvrir un signal de protection ?',
 a:'1. Les appareils de voie sont convenablement disposés ET les aiguilles collent\n2. Les croisements des appareils de voie sont dégagés\n3. La protection du parcours est assurée\n4. La partie de voie intéressée est libre'},
{theme:'aiguillage', tag:'AMV206', q:'Définir le temps moral.',

// SIGNAUX
{theme:'signaux', tag:'AMV207', q:'Citez les 5 familles de signaux (avec mémo famille A).',
 a:'A : Signaux d\'arrêt (mémo : 2C2SDG = Carré · Carré violet · Sémaphore · SAM · Disque · Guidon)\nB : Signaux d\'annonce d\'arrêt (avertissement)\nC : Signaux de limitation de vitesse\nD : Signaux présentés à l\'ouverture\nE : Signaux divers'},
{theme:'signaux', tag:'Famille A', q:'Quel est le rôle PRINCIPAL du carré ? Arrête-t-il ? Retient-il ?',

{theme:'signaux', tag:'Famille A', q:'Comment reconnaître un sémaphore ? Qu\'est-ce qui distingue sémaphore et carré ?',
 a:'Œilleton allumé = sémaphore / Œilleton fermé = carré. Sans œilleton avec un F = sémaphore. Le sémaphore assure l\'espacement des trains et est implanté à l\'origine du canton qu\'il protège.'},
{theme:'signaux', tag:'AMV207', q:'Distances minimales de visibilité des signaux ?',

// ENCLENCHEMENTS
{theme:'encl', tag:'AMV211', q:'Quel est le rôle de la Zone Isolée (ZI) ? Quand est-elle libérée ?',
 a:'ZI : interdire la manœuvre d\'une aiguille pendant son franchissement par une circulation. Agit sur le levier de l\'aiguille. Mise en action : zone propre présumée occupée (rouge). Libération : zone propre libre (blanc).'},
{theme:'encl', tag:'AMV211', q:'Quelles sont les 4 conditions du CIP pour libérer un signal ?',
 a:'1. Concordance de la position terrain / poste\n2. Collage de la lame appliquée donnant la direction\n3. Décollage de la lame opposée (aiguille intègre)\n4. Verrouillage lancé le cas échéant\n→ Libération : quand les 4 conditions sont réunies (voyant allumé)'},
{theme:'encl', tag:'AMV211', q:'Quel est le rôle de l\'EAP ? Quand est-il mis en action ?',
 a:'EAP : interdire toute opération permettant une destruction prématurée d\'itinéraire (ex : manœuvrer une aiguille devant une circulation). Mis en action : ZAP rouge ET signal commandé à l\'ouverture (levier en −). Libération : ZAP blanc OU fermeture automatique du signal.'},

{theme:'traction', tag:'AMV600', q:'Définir la Protection C.',

{theme:'travaux', tag:'AMV216', q:'Définir les catégories A, B et C.',

{theme:'travaux', tag:'AMV250', q:'Quelle est la méthode RITA de traitement d\'un dérangement IS ?',

{theme:'epi', tag:'Art.6.4.2', q:'Définir pistes et itinéraires.',

// ZD
{theme:'zd', tag:'RRA20068', q:'Donner toutes les distances de la ZD hors LGV et LGV.',

{theme:'zd', tag:'RRA20068', q:'Que faire en cas d\'arrivée surprise d\'une circulation dans la ZD ?',

{theme:'elect', tag:'OP491', q:'Citez les 3 familles d\'interdictions pour la sécurité électrique.',

{theme:'elect', tag:'OP491', q:'Que faire en cas d\'accident électrique ?',

{theme:'elect', tag:'OP491', q:'Comment annoncer une coupure d\'urgence ?',

{theme:'graissage', tag:'AMV804', q:'Que doit faire immédiatement un agent lors du graissage en entendant/voyant une circulation ?',

function init() {
  buildThemeNav();
  buildSearchIndex();
  showView('home');
}

function buildThemeNav() {
  const nav = document.getElementById('theme-nav');
  const saved = localStorage.getItem('themeOrder');
  let order = saved ? JSON.parse(saved) : THEMES.map(t => t.id);
  // Ensure all themes are present (in case new ones added)
  THEMES.forEach(t => { if (!order.includes(t.id)) order.push(t.id); });
  order = order.filter(id => THEMES.find(t => t.id === id));

  nav.innerHTML = `<div style="font-size:10px;color:var(--text3);padding:0 16px 6px;font-family:var(--mono);letter-spacing:0.08em">GLISSER POUR RÉORDONNER</div>` +
    order.map(id => {
      const t = THEMES.find(x => x.id === id);
      if (!t) return '';
      return `<div class="theme-item" id="tnav-${t.id}" draggable="true"
        ondragstart="dragStart(event,'${t.id}')"
        ondragover="dragOver(event)"
        ondrop="dragDrop(event,'${t.id}')"
        ondragend="dragEnd(event)"
        onclick="selectTheme('${t.id}')">
        <span style="font-size:10px;color:var(--text3);cursor:grab;margin-right:4px">⠿</span>
        <div class="theme-dot"></div>${t.short}
      </div>`;
    }).join('');
}

let dragSrc = null;
function dragStart(e, id) {
  dragSrc = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '0.5';
}
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function dragEnd(e) { e.currentTarget.style.opacity = ''; }
function dragDrop(e, targetId) {
  e.stopPropagation();
  if (dragSrc === targetId) return;
  const saved = localStorage.getItem('themeOrder');
  let order = saved ? JSON.parse(saved) : THEMES.map(t => t.id);
  const fromIdx = order.indexOf(dragSrc);
  const toIdx = order.indexOf(targetId);
  if (fromIdx < 0 || toIdx < 0) return;
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, dragSrc);
  localStorage.setItem('themeOrder', JSON.stringify(order));
  buildThemeNav();
  // Restore active state
  if (currentTheme) {
    const el = document.getElementById('tnav-' + currentTheme);
    if (el) el.classList.add('active');
  }
}

function selectTheme(id) {
  currentTheme = (currentTheme === id) ? null : id;
  document.querySelectorAll('.theme-item').forEach(el => el.classList.remove('active'));
  if (currentTheme) {
    const el = document.getElementById('tnav-' + currentTheme);
    if (el) el.classList.add('active');
  }
  if (currentView === 'flash') renderFlash();
  else if (currentView === 'quiz') renderQuiz();
  else if (currentView === 'fiches') renderFiches();
  else if (currentView === 'dictee') renderDictee();
}

function setNavActive(v) {
  ['home','fiches','flash','quiz','dictee'].forEach(x => {
    document.getElementById('nav-'+x).classList.toggle('active', x === v);
  });
}

function setTopbar(txt) {
  document.getElementById('topbar-txt').innerHTML = txt;
}

function showView(v) {
  currentView = v;
  setNavActive(v);
  closeSidebar();
  const c = document.getElementById('main-content');
  document.getElementById('topbar-right').innerHTML = '';
  if (v === 'home') { setTopbar('AMV / <span>Accueil</span>'); renderHome(c); }
  else if (v === 'fiches') { setTopbar('AMV / <span>Fiches de cours</span>'); renderFiches(c); }
  else if (v === 'flash') { setTopbar('AMV / <span>Flashcards</span>'); renderFlash(c); }
  else if (v === 'quiz') { setTopbar('AMV / <span>Quiz QCM</span>'); renderQuiz(c); }
  else if (v === 'dictee') { setTopbar('AMV / <span>Dictée de définitions</span>'); renderDictee(c); }
}
